name: sicma

x-laravel: &laravel
  image: sicma-app:local
  build:
    context: .
    target: app
  restart: unless-stopped
  init: true
  working_dir: /var/www/html
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-sicma}
    DB_USERNAME: ${DB_USERNAME:-sicma}
    DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
    DB_URL: ""
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    SICMA_SCHEDULER_MODE: queue
    DB_QUEUE_RETRY_AFTER: 300
    LOG_CHANNEL: stderr
  volumes:
    - ./.env:/var/www/html/.env
    - app_storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *laravel
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue:
    <<: *laravel
    user: www-data
    stop_signal: SIGTERM
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=1", "--timeout=240", "--max-time=3600", "--no-interaction"]
    stop_grace_period: 250s

  scheduler:
    <<: *laravel
    user: www-data
    stop_signal: SIGTERM
    command: ["php", "artisan", "schedule:work", "--no-interaction"]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sicma}
      MYSQL_USER: ${DB_USERNAME:-sicma}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di .env}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      # Skema terbaru terpisah; volume sicma_mysql_data lama tetap disimpan.
      - mysql_data_v2:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql_data_v2:
  app_storage:
