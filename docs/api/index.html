<!doctype html>
<html lang="id">
  <head>
    <title>Dokumentasi API SICMA JTIK</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z'/><path d='m3 9 2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9'/><path d='M12 3v6'/></svg>">
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      .top-banner {
        background: #1e293b;
        color: #f8fafc;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        border-bottom: 1px solid #334155;
      }
      .top-banner a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 600;
        margin-left: 15px;
      }
      .top-banner a:hover {
        text-decoration: underline;
      }
      .badge {
        background: #0284c7;
        color: white;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="top-banner">
      <div>
        <span class="badge">SICMA JTIK</span>
        <strong style="margin-left: 8px;">Dokumentasi API Interaktif</strong> &bull; Universitas Negeri Makassar
      </div>
      <div>
        <a href="./sicma.postman_collection.json" download="sicma.postman_collection.json">📥 Unduh Postman Collection</a>
        <a href="./sicma.postman_environment.json" download="sicma.postman_environment.json">🌐 Unduh Environment</a>
        <a href="./openapi.yaml" download="openapi.yaml">📄 Unduh OpenAPI Spec</a>
      </div>
    </div>

    <!-- Scalar API Reference Script -->
    <script
      id="api-reference"
      data-url="./openapi.yaml"
      data-proxy-url="https://proxy.scalar.com"
      data-configuration='{
        "theme": "purple",
        "darkMode": true,
        "showSidebar": true,
        "searchHotKey": "k",
        "layout": "modern"
      }'>
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
